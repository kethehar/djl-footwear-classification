# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - mdm-footwear-kethehar

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: https://github.com/kethehar/djl-footwear-classification/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_6175A5C1818F4AE784722422FF70CCE9 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_3DA4033810364E90B61BAFABFDC3583E }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ghcr.io/kethehar/djl-footwear-classification:latest
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0EEB92B7EF524968B2EA61F337506437 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6FD505AE694443268B6BDBB1B6F7B3A6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2BBD7DA3C3034CF7AC1E517251EF86FF }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'mdm-footwear-kethehar'
          slot-name: 'Production'
          images: 'github.com/kethehar/djl-footwear-classification/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_6175A5C1818F4AE784722422FF70CCE9 }}/:${{ github.sha }}'
          
